version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: docflow_db
    environment:
      POSTGRES_USER: docflow_user
      POSTGRES_PASSWORD: docflow_password
      POSTGRES_DB: docflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docflow_user -d docflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: docflow_api
    command: >
      sh -c "alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://docflow_user:docflow_password@db:5432/docflow
      # Add your API keys here or via a .env file!
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    volumes:
      - chroma_data:/app/chroma_db
      - upload_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Pass the API URL to Vite during build so the frontend knows where the backend is
        VITE_API_URL: "http://localhost:8000"
    container_name: docflow_frontend
    ports:
      - "3000:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
  chroma_data:
  upload_data:

[build]
  base = "frontend"
  command = "npm install && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # VITE_API_URL must be set in the Netlify Dashboard to point to your Render backend URL
  
# Redirect rule for Single Page Applications (React/Vite)
# This ensures that URLs like /dashboard don't return 404 but route to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

services:
  # FastAPI Backend Service
  - type: web
    name: docflow-backend
    env: python
    plan: free
    region: ohio
    rootDir: backend
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt"
    startCommand: "alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATABASE_URL
        sync: false # Set this to your Neon PostgreSQL connection string in the Render Dashboard
      - key: GEMINI_API_KEY
        sync: false # You must set this manually in the Render Dashboard
      - key: JWT_SECRET_KEY
        generateValue: true # Render will automatically generate a secure 256-bit secret
